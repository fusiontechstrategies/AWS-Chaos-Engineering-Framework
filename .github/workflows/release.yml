name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must contain a stable semantic version" >&2
            exit 1
          fi
          release_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
          test "$release_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$release_commit")" >> "$GITHUB_OUTPUT"

      - name: Install pinned build tools and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build-lock.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime-lock.txt

      - name: Install candidate execution isolation
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build exact release assets
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --wheel --sdist --outdir package-dist
          python scripts/normalize_wheel.py \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            package-dist/*.whl
          python scripts/normalize_sdist.py \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            package-dist/*.tar.gz
          python -m twine check package-dist/*
          python scripts/verify_distribution.py package-dist
          python scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-directory package-dist \
            --output-directory release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Rebuild and compare every release byte
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --wheel --sdist --outdir repeat-package-dist
          python scripts/normalize_wheel.py \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            repeat-package-dist/*.whl
          python scripts/normalize_sdist.py \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            repeat-package-dist/*.tar.gz
          python scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-directory repeat-package-dist \
            --output-directory repeat-release-assets
          test "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find repeat-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in release-assets/*; do
            cmp --silent "$artifact" "repeat-release-assets/${artifact##*/}"
          done

      - name: Exercise the exact standalone asset
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-assets/* > "$RUNNER_TEMP/release-assets-before-smoke.sha256"
          candidate="$GITHUB_WORKSPACE/release-assets/AWS-Chaos-Engineering-Framework-v$RELEASE_VERSION.py"
          install -m 0444 "$candidate" "$RUNNER_TEMP/chaos-candidate-smoke.py"
          cmp --silent "$candidate" "$RUNNER_TEMP/chaos-candidate-smoke.py"
          candidate="$RUNNER_TEMP/chaos-candidate-smoke.py"
          runtime="$(command -v python)"
          isolated=(sudo bwrap --unshare-pid --unshare-net --unshare-ipc --unshare-uts --unshare-cgroup-try --die-with-parent --new-session --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp --ro-bind "$candidate" /tmp/candidate.py --chdir /tmp --clearenv --setenv AWS_EC2_METADATA_DISABLED true --setenv PYTHONDONTWRITEBYTECODE 1 --cap-drop ALL --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs "$runtime" /tmp/candidate.py)
          version_output="$("${isolated[@]}" --version)"
          test "$version_output" = "AWS Chaos Engineering Framework $RELEASE_VERSION"
          "${isolated[@]}" --help >/dev/null
          "${isolated[@]}" --list-experiments >/dev/null
          sha256sum --check "$RUNNER_TEMP/release-assets-before-smoke.sha256"

      - name: Preserve the exact release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Attest every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  draft:
    name: Create and verify draft release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --title "AWS Chaos Engineering Framework $RELEASE_VERSION" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            "release-assets/AWS-Chaos-Engineering-Framework-v$RELEASE_VERSION.py" \
            "release-assets/aws_chaos_engineering_framework-$RELEASE_VERSION-py3-none-any.whl" \
            "release-assets/aws_chaos_engineering_framework-$RELEASE_VERSION.tar.gz" \
            "release-assets/AWS-Chaos-Engineering-Framework-v$RELEASE_VERSION.spdx.json" \
            "release-assets/SHA256SUMS.txt" \
            "release-assets/release-evidence.json"

      - name: Verify exact draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets > release-state.json
          python - "$RELEASE_VERSION" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          state = json.load(open("release-state.json", encoding="utf-8"))
          expected = {
              f"AWS-Chaos-Engineering-Framework-v{version}.py",
              f"aws_chaos_engineering_framework-{version}-py3-none-any.whl",
              f"aws_chaos_engineering_framework-{version}.tar.gz",
              f"AWS-Chaos-Engineering-Framework-v{version}.spdx.json",
              "SHA256SUMS.txt",
              "release-evidence.json",
          }
          actual = {asset["name"] for asset in state["assets"]}
          if state["isDraft"] is not True or state["isPrerelease"] is not False:
              raise SystemExit("Release must remain a non-prerelease draft")
          if actual != expected:
              raise SystemExit(f"Unexpected release asset set: {sorted(actual)}")
          PY
