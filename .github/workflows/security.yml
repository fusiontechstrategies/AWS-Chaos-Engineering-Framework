name: Security Scanners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "53 8 * * 4"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    # Every external revision used by the shared workflow is explicitly allowlisted.
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@315404828dfc3aec6dbb2629e3b53df21d61b5ee
    with:
      # The large framework module needs more than the shared 10-second per-rule default.
      semgrep_timeout_seconds: 30
