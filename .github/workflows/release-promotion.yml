name: Promote verified release candidate

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-promotion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.verified.outputs.artifact-id }}
      artifact-digest: ${{ steps.verified.outputs.artifact-digest }}
      artifact-run-id: ${{ github.run_id }}
      source-tag: ${{ steps.identity.outputs.source-tag }}
      verifier-commit: ${{ steps.identity.outputs.verifier-commit }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
      epoch: ${{ steps.identity.outputs.epoch }}
      version: ${{ steps.subjects.outputs.version }}
      tag: ${{ steps.subjects.outputs.tag }}
      manifest: ${{ steps.subjects.outputs.manifest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      VERIFIER_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out default-branch workflow verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Bind authenticated run, source and independent verifier
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GH_REPO" --jq .default_branch)" = main
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GH_REPO/commits/$VERIFIER_COMMIT" --jq .commit.verification.verified)" = true
          test "$(gh api "repos/$GH_REPO/commits/$SOURCE_COMMIT" --jq .commit.verification.verified)" = true
          git -C verifier merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git -C verifier merge-base --is-ancestor "$VERIFIER_COMMIT" origin/main
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > source-artifacts.json
          python -I verifier/scripts/verify_release_handoff.py identity source-run.json source-artifacts.json "$SOURCE_RUN" "$SOURCE_COMMIT" "$GH_REPO" > source-identity.json
          python -I - <<'PY'
          import json, os
          identity = json.load(open('source-identity.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('artifact-id=' + str(identity['artifact-id']), file=out)
              print('source-tag=' + identity['source-tag'], file=out)
              print('verifier-commit=' + os.environ['VERIFIER_COMMIT'], file=out)
              print('source-commit=' + os.environ['SOURCE_COMMIT'], file=out)
          PY
          echo "epoch=$(git -C verifier show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_OUTPUT"
      - name: Check out authenticated source strictly as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.identity.outputs.source-commit }}
          path: source-data
          persist-credentials: false
      - name: Bound and admit the authenticated outer artifact before extraction
        env:
          ARTIFACT_ID: ${{ steps.identity.outputs.artifact-id }}
        run: python -I verifier/scripts/download_release_artifact.py --repository "$GH_REPO" --artifact-id "$ARTIFACT_ID" --run-id "$SOURCE_RUN" --output release-assets
      - name: Derive exact verified subjects without executing tagged code
        id: subjects
        env:
          SOURCE_EPOCH: ${{ steps.identity.outputs.epoch }}
          SOURCE_TAG: ${{ steps.identity.outputs.source-tag }}
        shell: bash
        run: |
          set -euo pipefail
          python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" --expected-tag "$SOURCE_TAG" > subjects.json
          python -I - <<'PY'
          import json, os
          subjects = json.load(open('subjects.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('tag', 'version'):
                  print(name + '=' + subjects[name], file=out)
              print('manifest=' + json.dumps(subjects['manifest'], sort_keys=True, separators=(',', ':')), file=out)
          PY
          tag="$(python -I -c 'import json; print(json.load(open("subjects.json"))["tag"])')"
          python -I verifier/scripts/verify_release_integrity.py tag "$GH_REPO" "$tag" "$SOURCE_COMMIT"
      - name: Preserve only independently verified subjects for protected consumers
        id: verified
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-${{ github.event.workflow_run.id }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out independently trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.verifier-commit }}
          path: verifier
          persist-credentials: false
      - name: Check out authenticated tagged source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source-commit }}
          path: source-data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Bound and admit only the trusted verifier's immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_RUN_ID: ${{ needs.verify.outputs.artifact-run-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          ARTIFACT_NAME: verified-release-${{ github.event.workflow_run.id }}
        run: python -I verifier/scripts/download_release_artifact.py --repository "$GH_REPO" --artifact-id "$ARTIFACT_ID" --run-id "$ARTIFACT_RUN_ID" --expected-digest "$ARTIFACT_DIGEST" --expected-name "$ARTIFACT_NAME" --output release-assets
      - name: Reconstruct and verify exact subjects with protected code
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          SOURCE_EPOCH: ${{ needs.verify.outputs.epoch }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
          SOURCE_TAG: ${{ needs.verify.outputs.source-tag }}
        run: python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" --expected-manifest "$EXPECTED_MANIFEST" --expected-tag "$SOURCE_TAG"
      - name: Attest only the independently reconstructed subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/*

  draft:
    needs: [verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out independently trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.verifier-commit }}
          path: verifier
          persist-credentials: false
      - name: Check out authenticated tagged source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source-commit }}
          path: source-data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Bound and admit only the trusted verifier's immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_RUN_ID: ${{ needs.verify.outputs.artifact-run-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          ARTIFACT_NAME: verified-release-${{ github.event.workflow_run.id }}
        run: python -I verifier/scripts/download_release_artifact.py --repository "$GH_REPO" --artifact-id "$ARTIFACT_ID" --run-id "$ARTIFACT_RUN_ID" --expected-digest "$ARTIFACT_DIGEST" --expected-name "$ARTIFACT_NAME" --output release-assets
      - name: Reconstruct and verify exact subjects with protected code
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          SOURCE_EPOCH: ${{ needs.verify.outputs.epoch }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
          SOURCE_TAG: ${{ needs.verify.outputs.source-tag }}
        run: python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" --expected-manifest "$EXPECTED_MANIFEST" --expected-tag "$SOURCE_TAG"
      - name: Create draft and verify every remote subject
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          python -I verifier/scripts/create_verified_draft.py release-assets "source-data/.github/release-notes/$RELEASE_TAG.md" "$GH_REPO" "$RELEASE_TAG" "$SOURCE_COMMIT" "$EXPECTED_MANIFEST"
