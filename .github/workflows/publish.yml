name: Publish package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    name: Verify public release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-commit: ${{ steps.identity.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check out verification tools from the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: trusted-verifier
          persist-credentials: false

      - name: Verify external publishing controls
        shell: bash
        run: |
          set -euo pipefail
          git -C trusted-verifier fetch --no-tags origin main
          git -C trusted-verifier merge-base --is-ancestor "$WORKFLOW_COMMIT" origin/main
          mkdir publish-controls
          gh api "repos/$GH_REPO/environments/pypi" > publish-controls/environment.json
          gh api "repos/$GH_REPO/environments/pypi/deployment-branch-policies?per_page=100" > publish-controls/policies.json
          gh api "repos/$GH_REPO/branches/main" > publish-controls/protection.json
          gh api "repos/$GH_REPO" > publish-controls/repository.json
          gh api "repos/$GH_REPO/commits/$WORKFLOW_COMMIT" > publish-controls/workflow-commit.json
          python -I trusted-verifier/scripts/verify_publish_trust.py publish-controls \
            --ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_COMMIT"

      - name: Validate release identity and asset set
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(python -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$version"
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$WORKFLOW_COMMIT" origin/main
          test "$(gh api "repos/$GH_REPO/commits/$WORKFLOW_COMMIT" --jq '.commit.verification.verified')" = true
          git merge-base --is-ancestor "$commit" origin/main
          test "$(gh api "repos/$GH_REPO/commits/$commit" --jq '.commit.verification.verified')" = true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = false
          expected="$(printf '%s\n' \
            "AWS-Chaos-Engineering-Framework-v${version}.py" \
            "aws_chaos_engineering_framework-${version}-py3-none-any.whl" \
            "aws_chaos_engineering_framework-${version}.tar.gz" \
            "AWS-Chaos-Engineering-Framework-v${version}.spdx.json" \
            'SHA256SUMS.txt' 'release-evidence.json' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual"

      # Public release assets and their checksum and evidence manifests are
      # untrusted until provenance is verified. The trusted helper admits the
      # release metadata by per-file and aggregate size before any download,
      # streams each asset under a deadline into a new private directory, and
      # verifies the fixed six subjects without ever opening a manifest name.
      - name: Download and verify public release assets
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python -I trusted-verifier/scripts/release_asset_admission.py download \
            --repository "$GH_REPO" --tag "$RELEASE_TAG" --output release-assets
          python -I trusted-verifier/scripts/release_asset_admission.py verify release-assets \
            --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --source aws_chaos_framework.py
          python -I trusted-verifier/scripts/verify_distribution.py release-assets --repository-root "$GITHUB_WORKSPACE"

      - name: Verify GitHub provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GH_REPO"
          done

      - name: Bind the exact verified publish payload
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python -I trusted-verifier/scripts/publish_payload.py capture release-assets \
            --output-dir verified-payload --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-distributions
          path: verified-payload/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    name: Publish verified distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aws-chaos-engineering-framework
    permissions:
      id-token: write
      contents: read
      actions: read
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Check out verification tools from the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: trusted-verifier
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify external publishing controls
        shell: bash
        run: |
          set -euo pipefail
          git -C trusted-verifier fetch --no-tags origin main
          git -C trusted-verifier merge-base --is-ancestor "$WORKFLOW_COMMIT" origin/main
          mkdir publish-controls
          gh api "repos/$GH_REPO/environments/pypi" > publish-controls/environment.json
          gh api "repos/$GH_REPO/environments/pypi/deployment-branch-policies?per_page=100" > publish-controls/policies.json
          gh api "repos/$GH_REPO/branches/main" > publish-controls/protection.json
          gh api "repos/$GH_REPO" > publish-controls/repository.json
          gh api "repos/$GH_REPO/commits/$WORKFLOW_COMMIT" > publish-controls/workflow-commit.json
          python -I trusted-verifier/scripts/verify_publish_trust.py publish-controls \
            --ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_COMMIT"

      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-distributions
          path: verified-payload

      # The handoff and its bundled manifest come from the lower-privilege verify
      # job. This protected job independently resolves the tag, downloads the
      # public release evidence and verifies the protected release-promotion
      # provenance for that evidence and for the exact handed-off packages.
      - name: Independently authenticate release subjects in the protected job
        id: trusted
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          git -C trusted-verifier fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git -C trusted-verifier rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git -C trusted-verifier merge-base --is-ancestor "$commit" origin/main
          test "$(gh api "repos/$GH_REPO/commits/$commit" --jq '.commit.verification.verified')" = true
          test "$commit" = "$SOURCE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = false
          mkdir trusted-attestations
          python -I trusted-verifier/scripts/release_asset_admission.py download \
            --repository "$GH_REPO" --tag "$RELEASE_TAG" --output trusted-release \
            --only release-evidence.json
          signer="https://github.com/$GH_REPO/.github/workflows/release-promotion.yml@refs/heads/main"
          for subject in trusted-release/release-evidence.json \
            "verified-payload/packages/aws_chaos_engineering_framework-${version}-py3-none-any.whl" \
            "verified-payload/packages/aws_chaos_engineering_framework-${version}.tar.gz"; do
            gh attestation verify "$subject" --repo "$GH_REPO" \
              --cert-identity "$signer" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "trusted-attestations/${subject##*/}.json"
          done
          echo "source-commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Reverify exact bytes immediately before publishing
        env:
          TRUSTED_SOURCE_COMMIT: ${{ steps.trusted.outputs.source-commit }}
        shell: bash
        run: |
          set -euo pipefail
          python -I trusted-verifier/scripts/publish_payload.py verify verified-payload \
            --tag "$RELEASE_TAG" --source-commit "$TRUSTED_SOURCE_COMMIT" \
            --trusted-evidence trusted-release/release-evidence.json \
            --attestations trusted-attestations --repository "$GH_REPO"

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: verified-payload/packages
          attestations: true
          print-hash: true
