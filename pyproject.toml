[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-chaos-engineering-framework"
version = "2.0.0"
description = "Guarded AWS FIS orchestration and one-file chaos engineering extensions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Fusion Technology Strategies" }]
dependencies = [
  "boto3>=1.43.70,<2",
  "PyYAML>=6.0.3,<7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/fusiontechstrategies/AWS-Chaos-Engineering-Framework"
Issues = "https://github.com/fusiontechstrategies/AWS-Chaos-Engineering-Framework/issues"
Security = "https://github.com/fusiontechstrategies/AWS-Chaos-Engineering-Framework/security/policy"

[project.scripts]
aws-chaos-framework = "aws_chaos_framework:main"

[tool.setuptools]
py-modules = ["aws_chaos_framework"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
